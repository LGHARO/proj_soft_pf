spring.application.name=avaliacoes
server.port=${PORT:8080}

# Auth0 OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-mq0u4hp5ecfo3ppq.us.auth0.com/}

# Database Configuration (H2 by default locally, PostgreSQL when SPRING_DATASOURCE_URL is provided in Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/avaliacoesdb;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
